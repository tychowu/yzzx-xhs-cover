name: Publish version
on:
  workflow_run:
    workflows: [Skill checks]
    types: [completed]
    branches: [main]
permissions:
  contents: write
concurrency:
  group: publish-version
  cancel-in-progress: false
jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Publish approved version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          version=$(tr -d '\r\n' < VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Release already exists; never overwrite it."
            exit 0
          fi
          gh release create "v$version" --target "$RELEASE_SHA" --title "v$version" --notes-file CHANGELOG.md
